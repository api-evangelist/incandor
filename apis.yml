aid: incandor
name: Incandor
description: >-
  Incandor is a San Francisco based Y Combinator (Spring 2026) startup building
  behavioral intelligence infrastructure for fraud and abuse detection. Rather
  than relying on identity verification at account creation, Incandor constructs
  a behavioral map of every user on a platform from how they physically interact
  with an app or website — mouse dynamics, keystroke timing, scroll patterns, and
  on mobile how a device is held. It requires no fraud labels and no enrollment
  period, working from the first session. At the individual level it identifies
  account takeovers with greater than 99 percent accuracy; at the population level
  it separates out coordinated fraud rings, mule operators, shared operators, bots
  and agents, and coerced or duress sessions. Incandor is delivered as a
  programmable API and a client-side telemetry SDK rather than a black-box risk
  score, letting fraud teams combine behavioral signals with their own transaction
  history, customer records, and business rules. It collects only behavioral
  signals — not what users type, read, or view — keeping user data private by
  design. The company was founded by Matthew Yekell (CEO) and Luc Rosenzweig (CTO),
  both Stanford CS graduates. This profile is maintained by the API Evangelist
  network; the developer platform is currently early access.
