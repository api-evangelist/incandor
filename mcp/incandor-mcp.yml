tools:
- name: analyze_accounts
  description: "Score accounts for evidence that more than one person is using them, and return the accounts\
    \ they are behaviourally linked to.\n\nEach account's sessions are clustered into 'cores' -- groups\
    \ that look like a single person. Per account you get:\n  p_shared        0..1, probability the account\
    \ is used by several people\n  verdict         'single' (p<0.5), 'review' (p<0.938), 'shared' (p>=0.938)\n\
    \  session_groups  one array of session ids per person found\n  links           up to 5 other accounts\
    \ on the same platform whose behaviour matches, each with a 0..1 score\n\nEvery account costs a GPU\
    \ draw, so pass them all in one call rather than looping one at a time.\n\nTo analyse ONE person inside\
    \ a shared account, pass that person's ids from a previous session_groups result as session_ids (with\
    \ exactly one account_id). The parent account is then excluded from that person's links, so what comes\
    \ back is who that individual is linked to elsewhere."
- name: top_shared_accounts
  description: 'List your platform''s accounts with the highest sharedness, most shared first.


    Reads a live leaderboard: no GPU cost. An account appears only once it has been scored by analyze_accounts
    at least once, so this reflects what has been analysed so far, not the whole platform.'
- name: top_linked_accounts
  description: 'List the strongest behavioural links between pairs of accounts on your platform, strongest
    first. Useful for finding rings of accounts driven by one person.


    Same live leaderboard as top_shared_accounts: no GPU cost, and it only covers accounts that have already
    been analysed.'
